<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>勋章查看</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; background: #1a1a1a; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  .phone-frame {
    position: relative; width: 375px; height: 812px; overflow: hidden;
    border-radius: 20px; box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }

  .carousel-area {
    position: absolute; top: 222px; left: 0; width: 375px; height: 220px;
    overflow: visible; z-index: 5;
  }
  .carousel-track {
    position: relative; width: 100%; height: 100%;
    touch-action: pan-y;
  }
  .medal-large {
    position: absolute; top: 50%; left: 50%;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform, opacity, width, height;
    cursor: pointer;
  }
  .medal-large img {
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
  }
  .medal-large.active {
    width: 180px; height: 180px;
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; z-index: 3;
    filter: drop-shadow(0 4px 24px rgba(255, 180, 40, 0.35));
  }
  .medal-large.prev {
    width: 100px; height: 100px;
    transform: translate(calc(-50% - 185px), -50%) scale(1);
    opacity: 0.4; z-index: 2;
  }
  .medal-large.next {
    width: 100px; height: 100px;
    transform: translate(calc(-50% + 185px), -50%) scale(1);
    opacity: 0.4; z-index: 2;
  }
  .medal-large.hidden-left {
    width: 100px; height: 100px;
    transform: translate(calc(-50% - 320px), -50%) scale(0.8);
    opacity: 0; z-index: 1; pointer-events: none;
  }
  .medal-large.hidden-right {
    width: 100px; height: 100px;
    transform: translate(calc(-50% + 320px), -50%) scale(0.8);
    opacity: 0; z-index: 1; pointer-events: none;
  }

  .carousel-track.dragging .medal-large {
    transition: none !important;
  }

  .indicators-wrapper {
    position: absolute; top: 528px; left: 0; width: 375px; height: 54px;
    z-index: 5; overflow: visible;
  }
  .indicators {
    position: absolute; top: 0; left: 50%;
    display: flex; gap: 56px; align-items: center;
    height: 54px; padding: 9px 0;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
  }
  .indicators.dragging { transition: none !important; }
  .indicator {
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
    overflow: hidden; flex-shrink: 0;
    transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .indicator img {
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none;
  }
  .indicator.active { opacity: 1; transform: scale(1.05); }
  .indicator.inactive { opacity: 0.4; transform: scale(1); }
  .indicator.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }

  .medal-info {
    position: absolute; top: 120px; left: 0; width: 375px;
    z-index: 6; text-align: center; pointer-events: none;
    padding: 0 40px;
  }
  .medal-title-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 8px;
  }
  .medal-title-row .laurel {
    width: 16px; height: 40px;
    flex-shrink: 0;
  }
  .medal-title {
    font-family: 'Roboto', sans-serif;
    font-size: 20px; font-weight: 500;
    background: linear-gradient(to right, #ffe0ac 20%, #fff8ec 50%, #ffe0ac 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: normal;
    white-space: nowrap;
  }
  .medal-desc {
    font-family: 'Roboto', sans-serif;
    font-size: 14px; color: #e3bd7e;
    line-height: 20px;
  }

  .sparkle-container {
    position: absolute; top: -20px; left: 107.5px; width: 160px; height: 240px;
    z-index: 4; pointer-events: none; overflow: hidden;
  }
  .sparkle {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,220,150,1) 0%, rgba(255,200,100,0.5) 40%, transparent 70%);
    animation: sparkle-rise linear forwards;
    opacity: 0;
  }
  @keyframes sparkle-rise {
    0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
    15% { opacity: 1; }
    60% { opacity: 0.7; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.15); }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <img class="bg" src="assets/bg.png" alt="background">

  <div class="medal-info" id="medalInfo">
    <div class="medal-title-row">
      <img class="laurel" src="assets/laurel_left.svg" alt="">
      <span class="medal-title" id="medalTitle"></span>
      <img class="laurel" src="assets/laurel_right.svg" alt="" style="transform:scaleX(-1)">
    </div>
    <div class="medal-desc" id="medalDesc"></div>
  </div>

  <div class="sparkle-container" id="sparkleContainer"></div>

  <div class="carousel-area">
    <div class="carousel-track" id="carouselTrack"></div>
  </div>

  <div class="indicators-wrapper">
    <div class="indicators" id="indicators"></div>
  </div>


</div>

<script>
const medals = [
  { img: 'assets/medal_1.png', title: 'Rising Star Award', desc: 'Outstanding Newcomer. Recognizing exceptional new talent with remarkable growth potential.' },
  { img: 'assets/medal_2.png', title: 'Innovation Pioneer', desc: 'Creative Excellence. Celebrating breakthrough ideas and innovative solutions.' },
  { img: 'assets/medal_3.png', title: 'Seasonal Prestige Champion', desc: 'Team Quarterly Champion. Awarded for outstanding performance and great teamwork this quarter.' },
  { img: 'assets/medal_4.png', title: 'Elite Performance Medal', desc: 'Top Performer Recognition. Honoring consistent excellence and dedication to quality.' },
  { img: 'assets/medal_5.png', title: 'Legacy Achievement', desc: 'Lifetime Contribution. Celebrating years of dedicated service and lasting impact.' },
];

let current = 2;
let isDragging = false;
let startX = 0;
let dragDelta = 0;

const track = document.getElementById('carouselTrack');
const indicatorsEl = document.getElementById('indicators');
const indItemWidth = 36;
const indGap = 56;
const indStep = indItemWidth + indGap;

medals.forEach((m, i) => {
  const div = document.createElement('div');
  div.className = 'medal-large';
  div.dataset.index = i;
  div.innerHTML = `<img src="${m.img}" alt="">`;
  track.appendChild(div);

  const ind = document.createElement('div');
  ind.className = 'indicator';
  ind.dataset.index = i;
  ind.innerHTML = `<img src="${m.img}" alt="">`;
  ind.addEventListener('click', () => goTo(i));
  indicatorsEl.appendChild(ind);
});

const largeEls = track.querySelectorAll('.medal-large');
const indEls = indicatorsEl.querySelectorAll('.indicator');

function getClass(i) {
  const diff = i - current;
  if (diff === 0) return 'active';
  if (diff === -1) return 'prev';
  if (diff === 1) return 'next';
  if (diff < -1) return 'hidden-left';
  return 'hidden-right';
}

function getIndOffset(idx) {
  return -(idx * indStep + indItemWidth / 2);
}

const titleEl = document.getElementById('medalTitle');
const descEl = document.getElementById('medalDesc');

function render() {
  largeEls.forEach((el, i) => {
    el.className = 'medal-large ' + getClass(i);
  });
  indEls.forEach((el, i) => {
    const diff = Math.abs(i - current);
    if (diff > 1) el.className = 'indicator hidden';
    else if (i === current) el.className = 'indicator active';
    else el.className = 'indicator inactive';
  });
  indicatorsEl.style.transform = `translateX(${getIndOffset(current)}px)`;
  titleEl.textContent = medals[current].title;
  descEl.textContent = medals[current].desc;
}

function goTo(index) {
  if (index < 0 || index >= medals.length || index === current) return;
  current = index;
  render();
}

function applyDragOffset(dx) {
  const baseOff = { 'active': 0, 'prev': -185, 'next': 185, 'hidden-left': -320, 'hidden-right': 320 };
  largeEls.forEach((el, i) => {
    const cls = getClass(i);
    const b = baseOff[cls];
    if (b === undefined) return;
    const newOff = b + dx;
    const absOff = Math.abs(newOff);
    let w, op;
    if (absOff <= 185) {
      const t = absOff / 185;
      w = 180 - 80 * t;
      op = 1 - 0.6 * t;
    } else if (absOff <= 320) {
      const t = (absOff - 185) / 135;
      w = 100;
      op = 0.4 * (1 - t);
    } else {
      w = 100;
      op = 0;
    }
    el.style.width = w + 'px';
    el.style.height = w + 'px';
    el.style.transform = `translate(calc(-50% + ${newOff}px), -50%)`;
    el.style.opacity = Math.max(0, Math.min(1, op));
    el.style.zIndex = absOff < 100 ? 3 : (absOff < 250 ? 2 : 1);
  });
  indicatorsEl.style.transform = `translateX(${getIndOffset(current) + dx * (indStep / 185)}px)`;
}

function clearDragStyles() {
  largeEls.forEach(el => {
    el.style.transform = '';
    el.style.opacity = '';
    el.style.width = '';
    el.style.height = '';
    el.style.zIndex = '';
  });
}

track.addEventListener('touchstart', e => {
  isDragging = true;
  startX = e.touches[0].clientX;
  dragDelta = 0;
  track.classList.add('dragging');
  indicatorsEl.classList.add('dragging');
}, { passive: true });

track.addEventListener('touchmove', e => {
  if (!isDragging) return;
  dragDelta = e.touches[0].clientX - startX;
  if (current === 0 && dragDelta > 0) dragDelta *= 0.3;
  if (current === medals.length - 1 && dragDelta < 0) dragDelta *= 0.3;
  applyDragOffset(dragDelta);
}, { passive: true });

track.addEventListener('touchend', e => {
  if (!isDragging) return;
  isDragging = false;
  const absDelta = Math.abs(dragDelta);
  if (absDelta > 25) {
    if (dragDelta < 0 && current < medals.length - 1) current++;
    else if (dragDelta > 0 && current > 0) current--;
  }
  track.classList.remove('dragging');
  indicatorsEl.classList.remove('dragging');
  void track.offsetHeight;
  clearDragStyles();
  render();
  dragDelta = 0;
});

track.addEventListener('mousedown', e => {
  isDragging = true;
  startX = e.clientX;
  dragDelta = 0;
  track.classList.add('dragging');
  indicatorsEl.classList.add('dragging');
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  dragDelta = e.clientX - startX;
  if (current === 0 && dragDelta > 0) dragDelta *= 0.3;
  if (current === medals.length - 1 && dragDelta < 0) dragDelta *= 0.3;
  applyDragOffset(dragDelta);
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  const absDelta = Math.abs(dragDelta);
  if (absDelta > 25) {
    if (dragDelta < 0 && current < medals.length - 1) current++;
    else if (dragDelta > 0 && current > 0) current--;
  }
  track.classList.remove('dragging');
  indicatorsEl.classList.remove('dragging');
  void track.offsetHeight;
  clearDragStyles();
  render();
  dragDelta = 0;
});

largeEls.forEach(el => {
  el.addEventListener('click', () => {
    const i = parseInt(el.dataset.index);
    if (i !== current) goTo(i);
  });
});

render();

const sparkleBox = document.getElementById('sparkleContainer');
function spawnSparkle() {
  const dot = document.createElement('div');
  dot.className = 'sparkle';
  const size = Math.random() < 0.4 ? (2 + Math.random() * 3) : (7 + Math.random() * 8);
  const x = Math.random() * 160;
  const y = 100 + Math.random() * 120;
  const dur = 2 + Math.random() * 2.5;
  const delay = Math.random() * 0.5;
  const driftX = (Math.random() - 0.5) * 60;
  const riseY = -(60 + Math.random() * 100);
  dot.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;animation-duration:${dur}s;animation-delay:${delay}s;--dx:${driftX}px;--dy:${riseY}px;`;
  sparkleBox.appendChild(dot);
  setTimeout(() => dot.remove(), (dur + delay) * 1000);
}
setInterval(spawnSparkle, 180);
for (let i = 0; i < 15; i++) spawnSparkle();
</script>
</body>
</html>
